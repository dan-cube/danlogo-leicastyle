<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2400 900" width="2400" height="900"><rect width="2400" height="900" fill="#F0EDE6"/><text x="180" y="250" font-family="Helvetica Neue, PingFang SC, sans-serif" font-size="34" font-weight="500" letter-spacing="11.56" text-anchor="start" fill="#8A867D">DANLOGO</text><circle cx="444.0" cy="237.9" r="5.1" fill="#D8402A"/><text x="470.49999999999994" y="250" font-family="Helvetica Neue, PingFang SC, sans-serif" font-size="34" font-weight="500" letter-spacing="11.56" text-anchor="start" fill="#8A867D">LEICA STYLE</text><text x="174" y="470" font-family="PingFang SC, Helvetica Neue, sans-serif" font-size="176" font-weight="300" letter-spacing="10" text-anchor="start" fill="#151413">徕卡风格</text><text x="180" y="568" font-family="Helvetica Neue, PingFang SC, sans-serif" font-size="46" font-weight="400" letter-spacing="0" text-anchor="start" fill="#151413">Complete logo identity systems, with German precision</text><text x="180" y="660" font-family="PingFang SC, Helvetica Neue, sans-serif" font-size="34" font-weight="400" letter-spacing="0" text-anchor="start" fill="#5B5852">一个精确、只留本质的主体，加上一处有人的温度的签名。</text><text x="180" y="724" font-family="Helvetica Neue, PingFang SC, sans-serif" font-size="28" font-weight="400" letter-spacing="0" text-anchor="start" fill="#8A867D">One precise body, one human signature. Remove the signature, and the body still holds.</text><rect x="1500" y="205" width="2" height="545" fill="#151413" opacity="0.12"/><rect x="1590" y="222" width="300" height="300" fill="#E7E3DA"/><svg x="1650.0" y="282.0" width="180.0" height="180.0" preserveAspectRatio="xMidYMid meet" viewBox="0 0 100 100" aria-label="标志 C 空" xmlns="http://www.w3.org/2000/svg"><path d="M33 93.4V7.6H47A25 25 0 0 1 47 57.6" fill="none" stroke="#151413" stroke-width="5.2"/><circle cx="47" cy="91.4" r="4.6" fill="#D8402A"/></svg><text x="1590" y="574" font-family="PingFang SC, Helvetica Neue, sans-serif" font-size="30" font-weight="400" letter-spacing="0" text-anchor="start" fill="#5B5852">标志 Mark</text><rect x="1920" y="222" width="300" height="300" fill="#151413"/><svg x="1980.0" y="282.0" width="180.0" height="180.0" preserveAspectRatio="xMidYMid meet" viewBox="0 0 100 100" aria-label="标志 C 空" xmlns="http://www.w3.org/2000/svg"><path d="M33 93.4V7.6H47A25 25 0 0 1 47 57.6" fill="none" stroke="#F0EDE6" stroke-width="5.2"/><circle cx="47" cy="91.4" r="4.6" fill="#D8402A"/></svg><text x="1920" y="574" font-family="PingFang SC, Helvetica Neue, sans-serif" font-size="30" font-weight="400" letter-spacing="0" text-anchor="start" fill="#5B5852">反白 Reversed</text><text x="2220" y="724" font-family="PingFang SC, Helvetica Neue, sans-serif" font-size="26" font-weight="400" letter-spacing="0" text-anchor="end" fill="#8A867D">案例 · EonPoint 亿触点 方案 C「空」</text></svg>